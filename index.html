<style>

*{box-sizing:border-box}

.qfoot{margin-top:18px}

<body>
<div id="login" class="login" hidden>
 <form class="box2" id="loginForm">
  <h1>일본어 공부방</h1>
  <p>Supabase에 만들어 둔 내 계정으로 로그인하세요.</p>
  <input id="lgEmail" type="email" autocomplete="username" placeholder="이메일" required>
  <input id="lgPw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
  <button class="btn full" id="lgBtn" type="submit">로그인</button>
  <p id="lgMsg"></p>
 </form>
</div>
<div class="app" id="appShell" hidden>
 <aside class="side">
  <div class="logo">일본어 공부방<small>N5 → N2 · 워홀 준비</small></div>
  <nav class="nav" id="sideNav"></nav>
  <button class="setlink" type="button" onclick="nav('settings')">⚙ 설정</button>
  <div class="foot" id="unitFoot"></div>
 </aside>
 <main id="view"><div class="loading">공부방을 여는 중…</div></main>
</div>
<nav class="tabbar" id="tabBar" hidden></nav>
<div id="toasts" aria-live="polite"></div>
<div id="bgTask" class="bgtask" hidden></div>
<div id="netNote">저장소 응답이 늦어요. 인터넷 연결을 확인해 주세요.</div>
<div id="setup" class="login" hidden><div class="box2"><h1>연결 설정이 필요해요</h1><p>config.js에 Supabase 주소와 anon 키를 넣어 주세요. 설치 안내서(README)의 3단계를 확인하세요.</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/quiz.js"></script>
<script src="js/views.js"></script>
<script src="js/study.js"></script>
<script src="js/lookup.js"></script>
<script src="js/supa.js"></script>
<script>
(async () => {
  const cfg = window.JP_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) { $('#setup').hidden = false; return; }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  App.signOut = async () => { await sb.auth.signOut(); location.reload(); };
  let { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $('#login').hidden = false;
    session = await new Promise(resolve => {
      $('#loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = $('#lgBtn'); btn.disabled = true; $('#lgMsg').textContent = '';
        const { data, error } = await sb.auth.signInWithPassword({ email: $('#lgEmail').value.trim(), password: $('#lgPw').value });
        btn.disabled = false;
        if (error) { $('#lgMsg').textContent = '로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요.'; return; }
        resolve(data.session);
      });
    });
    $('#login').hidden = true;
  }
  $('#appShell').hidden = false; $('#tabBar').hidden = false;
  const sn = $('#sideNav'), tb = $('#tabBar');
  for (const [k, ic, n] of TABS) {
    sn.append(h('button', { 'data-tab': k, onclick: () => nav(k) }, h('i', {}, ic), n));
    tb.append(h('button', { 'data-tab': k, onclick: () => nav(k) }, h('i', {}, ic), n === '내 실력' ? '실력' : n));
  }
  TTS.init();
  try { await loadMaster(); } catch { $('#view').innerHTML = '<div class="loading">기본 데이터를 불러오지 못했어요. 새로고침해 주세요.</div>'; return; }
  const uid = session.user.id;
  App.db = makeDb(sb, uid); App.sample = makeSample(sb); App.assets = makeAssets(sb, uid);
  try { await firstRunSeed(); await loadAll(); } catch (e) { toast('저장된 기록을 불러오지 못했어요. 새로고침해 주세요.', 'err'); }
  // 6시간 넘게 남아 있는 AI 작업 기록은 정리
  App.db.collection('jobs').get().then(snap => snap.docs.forEach(d => { const x = d.data() || {}; if (Date.now() - (x.at || 0) > 6 * 3600e3 && d.id !== App.state.pendingLesson?.jobId) App.db.doc('jobs/' + d.id).delete().catch(() => {}); })).catch(() => {});
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  if (App.state.site !== base) { App.state.site = base; saveState(); }
  App.ready = true;
  let start = 'today'; try { start = localStorage.getItem('jp.tab') || 'today'; } catch { }
  nav(TABS.some(t => t[0] === start) ? start : 'today');
  // 다른 기기에서 공부한 내용이 보이도록, 한동안 안 보다가 돌아오면 최신 기록을 다시 불러와요
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); flushSaves(); return; }
    const newDay = ymd() !== App.today;
    if (newDay) { App.today = ymd(); App.dayDoc = null; }
    const busyUI = document.querySelector('.overlay, .modal-bg');
    if ((newDay || Date.now() - hiddenAt > 120000) && !busyUI) {
      try { await flushSaves(); await loadAll(); App.dayDoc = null; nav(App.tab, App.sub); } catch { }
    }
  });
})();
</script>
